services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lure
      POSTGRES_PASSWORD: lure_dev_2026
      POSTGRES_DB: luremaster
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "29683:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lure -d luremaster"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "29684:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: lureminio
      MINIO_ROOT_PASSWORD: lureminio_dev_2026
    ports:
      - "29685:9000"
      - "29686:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      APP_ENV: docker
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://lure:lure_dev_2026@postgres:5432/luremaster?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: luremaster-dev-jwt-secret-change-me
      HYDRO_PROVIDER: mock
      TIDE_PROVIDER: harmonic
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: lureminio
      S3_SECRET_KEY: lureminio_dev_2026
      S3_BUCKET: lure-catches
      S3_USE_PATH_STYLE: "true"
      STORAGE_DRIVER: s3
      CORS_ORIGINS: http://localhost:29681
      LOG_LEVEL: info
    ports:
      - "29682:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
    ports:
      - "29681:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  qa:
    profiles: ["qa"]
    image: python:3.12-alpine
    working_dir: /qa
    volumes:
      - ./tests:/qa
    environment:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      API_BASE: http://backend:8080
      WEB_BASE: http://frontend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    command: ["sh", "-c", "pip install -q pytest==8.3.4 requests==2.32.3 && python -m pytest -p no:cacheprovider -q api_smoke.py"]

volumes:
  pgdata:
  redisdata:
  miniodata:
